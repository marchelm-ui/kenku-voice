name: Probe Kokoro files
on:
  push:
    branches: [probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          set +e
          exec > probe-out.txt 2>&1
          python3 -m pip install --quiet sherpa-onnx==1.13.8 numpy
          python3 tools/probe2.py
          echo "== sfx crawl"
          python3 tools/sfx_crawl.py https://opengameart.org/content/50-rpg-sound-effects https://opengameart.org/content/rpg-sound-pack https://opengameart.org/content/medieval-smith-pack https://opengameart.org/content/80-cc0-creature-sfx https://opengameart.org/content/100-cc0-sfx https://opengameart.org/content/100-cc0-sfx-2
          echo "== sfx files"
          for d in sfx_raw/*/; do echo "## $d $(ls $d | wc -l) files $(du -sh $d | cut -f1)"; ls $d | head -400; done
          cd sfx_raw && zip -qr ../sfx-raw.zip . && cd .. && ls -la sfx-raw.zip
      - name: Publish raw sounds for inspection
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-sfx
          name: probe-sfx (internal)
          prerelease: true
          files: sfx-raw.zip
      - name: Save results
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt && git commit -m "probe results" && git push

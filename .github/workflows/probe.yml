name: Probe Kokoro files
on:
  push:
    branches: [probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          set +e
          exec > probe-out.txt 2>&1
          python3 -m pip install --quiet --break-system-packages sherpa-onnx==1.13.8 numpy || python3 -m pip install --quiet sherpa-onnx==1.13.8 numpy
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2 | tar xjf -
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2 | tar xjf - && mv kokoro-int8-multi-lang-v1_0 kok_int8
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 | tar xjf - && mv kokoro-multi-lang-v1_0 kok_fp32
          ls kok_fp32
          lscpu | head -20
          python3 tools/speed_test.py
      - name: Save results
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt && git commit -m "probe results" && git push

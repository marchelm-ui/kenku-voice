name: Probe Kokoro files
on:
  push:
    branches: [probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          set +e
          exec > probe-out.txt 2>&1
          curl -sL -o s.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -la s.aar; unzip -l s.aar
          unzip -o -q s.aar classes.jar jni/arm64-v8a/* AndroidManifest.xml
          echo "== classes"; unzip -l classes.jar | grep -v '\$' | head -80
          echo "== manifest"; cat AndroidManifest.xml
          echo "== 16KB alignment arm64"
          for f in jni/arm64-v8a/*.so; do echo "$f $(readelf -lW $f | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')"; done
          echo "== static aar"
          curl -sL -o st.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar
          unzip -l st.aar | grep -E 'jni|classes'
          echo "== model v1_0 int8"
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2 | tar xjf -
          D=kokoro-int8-multi-lang-v1_0
          ls -la $D; du -sh $D/*; cat $D/README.md
          echo "== espeak top"; ls $D/espeak-ng-data; du -sh $D/espeak-ng-data/*  | sort -h | tail -8
          echo "== Android TTS example MainActivity"
          curl -s https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/android/SherpaOnnxTts/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt | grep -n -i -E 'asset|copy|dataDir|espeak|getOfflineTtsConfig|lexicon|kokoro|externalFilesDir|filesDir' | head -60
      - name: Save results
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt && git commit -m "probe results" && git push

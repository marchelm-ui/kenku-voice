name: Build Kenku Voice app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk KenkuVoice.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: KenkuVoice
          path: KenkuVoice.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kenku Voice build ${{ github.run_number }}
          body: Download KenkuVoice.apk below on your Android phone and open it to install.
          files: KenkuVoice.apk
          make_latest: true

name: Build Mocking Bird app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Reuse downloaded voice files
        uses: actions/cache@v4
        with:
          path: dl
          key: arm-sherpa-onnx-1.13.8-kokoro-multi-lang-v1_0-pocket-int8-2026-01-26
      - name: Get the voice models
        run: |
          set -euo pipefail
          mkdir -p dl
          [ -s dl/kokoro.tar.bz2 ] || curl -fL --retry 3 -o dl/kokoro.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          [ -s dl/pocket.tar.bz2 ] || curl -fL --retry 3 -o dl/pocket.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          tar xjf dl/kokoro.tar.bz2
          tar xjf dl/pocket.tar.bz2
      - name: Test voices, cloning and speed on ARM
        run: |
          set -o pipefail
          python3 -m pip install --quiet --break-system-packages sherpa-onnx==1.13.8 numpy scipy 2>/dev/null || python3 -m pip install --quiet sherpa-onnx==1.13.8 numpy scipy
          python3 tools/voice_test.py kokoro-multi-lang-v1_0 sherpa-onnx-pocket-tts-int8-2026-01-26 kenku-sample.wav 2>&1 | tee voice-test-log.txt
      - name: Save the voice test log if it failed
        if: failure()
        run: |
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp voice-test-log.txt failure-log.txt 2>/dev/null || echo "no voice test log" > failure-log.txt
          git add -f failure-log.txt
          git commit -m "Voice test ${{ github.run_number }} failure log"
          git push -f origin build-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test
          path: |
            kenku-sample.wav
            voice-test-log.txt

  build:
    needs: voice-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Reuse downloaded voice files
        uses: actions/cache@v4
        with:
          path: dl
          key: sherpa-onnx-1.13.8-kokoro-multi-lang-v1_0-pocket-int8-2026-01-26

      - name: Get the speech engine and Kokoro voices
        run: |
          set -euo pipefail
          mkdir -p dl app/libs app/src/main/assets/kokoro
          [ -s dl/sherpa-onnx.aar ] || curl -fL --retry 3 -o dl/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          [ -s dl/kokoro.tar.bz2 ] || curl -fL --retry 3 -o dl/kokoro.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          [ -s dl/pocket.tar.bz2 ] || curl -fL --retry 3 -o dl/pocket.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          cp dl/sherpa-onnx.aar app/libs/sherpa-onnx.aar
          tar xjf dl/kokoro.tar.bz2
          tar xjf dl/pocket.tar.bz2
          D=kokoro-multi-lang-v1_0
          cp $D/model.onnx $D/voices.bin $D/tokens.txt $D/lexicon-us-en.txt $D/lexicon-zh.txt app/src/main/assets/kokoro/
          cp -r $D/espeak-ng-data app/src/main/assets/kokoro/
          P=sherpa-onnx-pocket-tts-int8-2026-01-26
          mkdir -p app/src/main/assets/pocket
          cp $P/lm_flow.int8.onnx $P/lm_main.int8.onnx $P/encoder.onnx $P/decoder.int8.onnx $P/text_conditioner.onnx $P/vocab.json $P/token_scores.json app/src/main/assets/pocket/
          du -sh app/src/main/assets/*

      - name: Get the voice test results
        uses: actions/download-artifact@v4
        with:
          name: voice-test

      - name: Run the unit tests
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest --no-daemon 2>&1 | tee build-log.txt
          echo "== unit test summary =="
          find app/build/test-results -name '*.xml' | xargs grep -h -o 'tests="[0-9]*"' | awk -F'"' '{s+=$2} END {print s " tests ran"}'

      - name: Build the APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee -a build-log.txt

      - name: Run Android lint (report only)
        run: |
          gradle :app:lintRelease --no-daemon --continue > lint-log.txt 2>&1 || true
          ls app/build/reports/ 2>/dev/null || true
          (grep -E "Error|Warning" -A0 app/build/reports/lint-results-release.txt 2>/dev/null | head -c 150000 || true) > lint-summary.txt
          cp app/build/reports/lint-results-release.txt lint-full.txt 2>/dev/null || cp lint-log.txt lint-full.txt
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git fetch -q origin lint-report 2>/dev/null || true
          git checkout -q --orphan lint-report
          git rm -rf -q --cached . > /dev/null
          git add -f lint-full.txt
          git commit -q -m "Lint report build ${{ github.run_number }}"
          git push -q -f origin lint-report
          git checkout -q -f ${{ github.sha }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk MockingBird.apk

      - name: Check the APK
        run: |
          set -euo pipefail
          ls -la MockingBird.apk
          unzip -l MockingBird.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l MockingBird.apk | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          unzip -l MockingBird.apk | grep -q 'assets/kokoro/model.onnx'
          unzip -l MockingBird.apk | grep -q 'assets/pocket/lm_main.int8.onnx'
          unzip -l MockingBird.apk | grep -q 'assets/sfx/catalog.json'
          unzip -l MockingBird.apk | grep -q 'assets/kokoro/voices.bin'
          unzip -l MockingBird.apk | grep -q 'assets/kokoro/espeak-ng-data/phontab'
          ZA=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)zipalign
          $ZA -c -P 16 4 MockingBird.apk && echo "16 KB page alignment OK"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs MockingBird.apk | head -3

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MockingBird
          path: MockingBird.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mocking Bird build ${{ github.run_number }}
          body: "Download MockingBird.apk below on your Android phone and open it to install. Speak, Clones and Sounds tabs with 54 voices, voice cloning, a phrasebook, voice effects and 460+ medieval sounds. Large download (about 600 MB)."
          files: |
            MockingBird.apk
            kenku-sample.wav
            voice-test-log.txt
          make_latest: true

      - name: Save the error log if the build failed
        if: failure()
        run: |
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          tail -c 200000 build-log.txt > failure-log.txt 2>/dev/null || echo "no gradle log" > failure-log.txt
          git add -f failure-log.txt
          git commit -m "Build ${{ github.run_number }} failure log"
          git push -f origin build-logs
